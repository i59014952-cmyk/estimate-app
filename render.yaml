services:
  - type: web
    name: petrovich-proxy
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: LEMANA_HEADLESS
        value: "0"
      - key: LEMANA_CHROME_MAIN
        value: "148"
