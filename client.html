<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Смета — KUB HOUSE</title>
<style>
  :root{
    --paper:#f6f1e9; --paper-2:#efe7d7; --ink:#1f1a15; --ink-2:#5b524a;
    --ink-3:#8a7f73; --rule:#d9cdb6; --moss:#5b8362; --rust:#a44a3f;
    --wood-deep:#7a5a36;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#e8e0cf;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
  .wrap{max-width:1100px;margin:32px auto;padding:32px 36px;background:var(--paper);border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  h1{margin:0 0 4px;font-family:Georgia,serif;font-size:28pt;font-weight:500}
  h1 em{font-style:italic;color:var(--wood-deep);font-weight:500}
  .meta{color:var(--ink-3);font-size:12px;letter-spacing:.06em}
  .totals{display:flex;justify-content:space-between;margin-top:18px;font-size:15px;color:var(--ink-2)}
  .totals .grand{font-weight:600;color:var(--ink);font-size:18px}
  table{width:100%;border-collapse:collapse;margin-top:18px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);font-size:14px;vertical-align:middle}
  th{background:var(--paper-2);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
  td.num,th.num{text-align:right}
  td.idx{color:var(--ink-3);font-variant-numeric:tabular-nums;width:36px}
  td.unit{color:var(--ink-2);width:80px}
  td.qty{width:100px}
  td.qty input{width:100%;padding:6px 8px;border:1px solid var(--rule);background:var(--paper);font-size:14px;font-family:inherit;border-radius:4px;text-align:right}
  td.qty input:focus{outline:none;border-color:var(--moss);background:#fff}
  td.price{width:120px;color:var(--ink-2)}
  td.total{width:140px;font-weight:500}
  td.act{width:48px;text-align:right}
  td.act button{background:transparent;border:0;color:var(--rust);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:4px}
  td.act button:hover{background:rgba(164,74,63,.08)}
  .empty{padding:60px;text-align:center;color:var(--ink-3)}
  .err-page{padding:60px;text-align:center}
  .saved{position:fixed;bottom:24px;right:24px;background:#3a5a3e;color:#e0eed4;padding:10px 16px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s}
  .saved.show{opacity:1}
  @media (max-width:760px){
    .wrap{margin:0;padding:18px 14px;border-radius:0;box-shadow:none}
    h1{font-size:22pt}
    table{display:block;overflow-x:auto;white-space:nowrap}
    .totals{flex-direction:column;align-items:flex-start;gap:6px}
  }
</style>
</head>
<body>

<div class="wrap" id="root">
  <div class="meta">Загрузка…</div>
</div>
<div id="saved" class="saved">Сохранено</div>

<script>
const SB_URL = 'https://jvqogyyjlrwbjjotxvue.supabase.co';
const SB_KEY = 'sb_publishable_Yud_fsFEOxUAiPboEqVO1g_17BKYlDh';
const HEADERS = {
  apikey: SB_KEY,
  Authorization: 'Bearer ' + SB_KEY,
  'Content-Type': 'application/json',
};

const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s == null ? '' : s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const fmt = (n) => Math.round(Number(n) || 0).toLocaleString('ru-RU');

let rows = [];
let saveTimer = null;

async function fetchJSON(url, opts) {
  const r = await fetch(url, { headers: HEADERS, ...opts });
  if (!r.ok) throw new Error(r.status + ' ' + (await r.text()));
  if (r.status === 204) return null;
  return r.json();
}

async function loadEstimate() {
  const r = await fetchJSON(`${SB_URL}/rest/v1/kh_client_estimates?token=eq.${encodeURIComponent(token)}&select=rows`);
  if (!r || !r.length) return null;
  return Array.isArray(r[0].rows) ? r[0].rows : [];
}

async function saveEstimate() {
  await fetchJSON(`${SB_URL}/rest/v1/kh_client_estimates?token=eq.${encodeURIComponent(token)}`, {
    method: 'PATCH',
    headers: { ...HEADERS, Prefer: 'return=minimal' },
    body: JSON.stringify({ rows, updated_at: new Date().toISOString() }),
  });
  flashSaved();
}

function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveEstimate().catch(e => console.error('save error', e)); }, 600);
}

function flashSaved() {
  const el = $('#saved');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1200);
}

function totals() {
  let subtotal = 0;
  for (const r of rows) {
    if (r.notFound) continue;
    subtotal += (Number(r.qty) || 0) * (Number(r.unitPrice) || 0);
  }
  const vat = subtotal * 0.20;
  return { subtotal, vat, grand: subtotal + vat };
}

function render() {
  const t = totals();
  const body = rows.length ? `
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Наименование</th>
          <th>Ед. изм.</th>
          <th class="num">Кол-во</th>
          <th class="num">Цена, ₽</th>
          <th class="num">Итого, ₽</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${rows.map((r, i) => `
          <tr data-id="${r.id}">
            <td class="idx">${String(i + 1).padStart(2, '0')}</td>
            <td>${esc(r.name)}</td>
            <td class="unit">${esc(r.unit || '—')}</td>
            <td class="qty"><input type="text" inputmode="decimal" value="${String(r.qty).replace('.', ',')}" data-field="qty"></td>
            <td class="num price">${r.unitPrice ? fmt(r.unitPrice) : '—'}</td>
            <td class="num total">${r.unitPrice ? fmt((Number(r.qty) || 0) * (Number(r.unitPrice) || 0)) : '—'}</td>
            <td class="act"><button data-action="remove" title="Удалить строку">×</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    <div class="totals">
      <div>Без НДС: <b>${fmt(t.subtotal)} ₽</b></div>
      <div>НДС 22%: <b>${fmt(t.vat)} ₽</b></div>
      <div class="grand">Итого: ${fmt(t.grand)} ₽</div>
    </div>
  ` : '<div class="empty">Все позиции удалены.</div>';

  $('#root').innerHTML = `
    <h1>Смета <em>«Сосны»</em></h1>
    <div class="meta" style="margin-top:8px">Вы можете изменить количество и удалить позиции. Цены зафиксированы — изменить их можно только на стороне исполнителя.</div>
    ${body}
  `;

  document.querySelectorAll('tr[data-id]').forEach(tr => {
    const id = Number(tr.dataset.id);
    tr.querySelectorAll('input[data-field="qty"]').forEach(inp => {
      inp.addEventListener('input', () => {
        const r = rows.find(x => x.id === id); if (!r) return;
        const v = parseFloat(String(inp.value).replace(',', '.'));
        r.qty = isFinite(v) && v >= 0 ? v : 0;
        const tot = (Number(r.qty) || 0) * (Number(r.unitPrice) || 0);
        const cell = tr.querySelector('td.total');
        if (cell) cell.textContent = r.unitPrice ? fmt(tot) : '—';
        renderTotalsOnly();
        scheduleSave();
      });
      inp.addEventListener('blur', () => render());
    });
    const btn = tr.querySelector('button[data-action="remove"]');
    if (btn) btn.onclick = () => {
      rows = rows.filter(x => x.id !== id);
      render();
      scheduleSave();
    };
  });
}

function renderTotalsOnly() {
  const t = totals();
  const totalsEl = document.querySelector('.totals');
  if (!totalsEl) return;
  totalsEl.innerHTML = `
    <div>Без НДС: <b>${fmt(t.subtotal)} ₽</b></div>
    <div>НДС 22%: <b>${fmt(t.vat)} ₽</b></div>
    <div class="grand">Итого: ${fmt(t.grand)} ₽</div>
  `;
}

(async function init() {
  if (!token) {
    $('#root').innerHTML = '<div class="err-page"><h1 style="color:var(--rust)">Нет токена</h1><div>Откройте ссылку, которую вам прислал исполнитель.</div></div>';
    return;
  }
  try {
    const loaded = await loadEstimate();
    if (loaded === null) {
      $('#root').innerHTML = '<div class="err-page"><h1 style="color:var(--rust)">Ссылка не найдена</h1><div>Возможно, исполнитель её отозвал или скопировал не полностью.</div></div>';
      return;
    }
    rows = loaded;
    render();
  } catch (e) {
    $('#root').innerHTML = `<div class="err-page"><h1 style="color:var(--rust)">Ошибка соединения</h1><div>${esc(e.message || e)}</div></div>`;
  }
})();
</script>

</body>
</html>
