<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light"
}/*EDITMODE-END*/;
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [role, setRole] = React.useState("estimator");
  const est = useEstimatesManager();
  const [compareOpen, setCompareOpen] = React.useState(false);
  window.KH_EST_ID = est.currentId;
  React.useEffect(() => { document.documentElement.setAttribute("data-theme", t.theme); }, [t.theme]);
  React.useEffect(() => {
    let alive = true;
    if (!(window.KHAuth && window.KHAuth.me)) return;
    window.KHAuth.me()
      .then((r) => { if (alive && r && r.role) setRole(r.role); })
      .catch(() => {});
    return () => { alive = false; };
  }, []);
  const roleValue = React.useMemo(() => ({ role, caps: capsForRole(role) }), [role]);
  return (
    <KHRoleCtx.Provider value={roleValue}>
      <EstimatesTabs index={est.index} currentId={est.currentId} onSwitch={est.setCurrentId} onNew={est.create} onClose={est.close} onCompare={() => setCompareOpen(true)} />
      <CompareEstimatesModal open={compareOpen} onClose={() => setCompareOpen(false)} index={est.index} />
      <Workspace
        key={est.currentId}
        theme={t.theme}
        onTheme={() => setTweak("theme", t.theme === "dark" ? "light" : "dark")}
        onNewEstimate={est.create}
        onRename={(name) => est.rename(est.currentId, name)}
      />
      <TweaksPanel>
        <TweakSection label="Тема" />
        <TweakRadio label="Палитра" value={t.theme}
          options={[{value:"light",label:"Свет"},{value:"warm",label:"Тёпл."},{value:"dark",label:"Тьма"}]}
          onChange={(v) => setTweak("theme", v)} />
      </TweaksPanel>
    </KHRoleCtx.Provider>
  );
}
function Root() {
  const [authed, setAuthed] = React.useState(() => window.KHAuth.isAuthed());
  if (!authed) return <Login onSuccess={() => setAuthed(true)} />;
  return <App />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
