<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор сметы</title>
    <link rel="stylesheet" href="styles.css?v=13">
</head>
<body>
    <div class="container">
        <h1>Калькулятор сметы</h1>

        <div id="status" class="status"></div>

        <section class="search-block">
            <label for="search">Поиск работы</label>
            <input type="text" id="search" placeholder="Начните вводить название…" autocomplete="off" disabled>
            <div id="results" class="results"></div>
        </section>

        <section class="upload-block">
            <button id="upload-btn" type="button" disabled>Загрузить список работ</button>
            <button id="template-btn" type="button">Скачать шаблон</button>
            <button id="petrovich-btn" type="button" disabled>Подтянуть цены с Петровича</button>
            <button id="lemanapro-btn" type="button" disabled>Подтянуть цены с Леманы</button>
            <button id="kolorit-btn" type="button" disabled>Подтянуть цены с Колорита</button>
            <input type="file" id="file-input" accept=".csv,.xlsx,.xls,.pdf,.docx,.jpg,.jpeg,.png" hidden>
            <div id="upload-summary" class="upload-summary"></div>
        </section>

        <section class="estimate">
            <div class="estimate-header">
                <h2>Смета</h2>
                <button id="export-btn" type="button">Экспорт в CSV</button>
            </div>
            <table id="estimate-table">
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Ед. изм.</th>
                        <th>Кол-во</th>
                        <th>Цена за ед.</th>
                        <th>Итого</th>
                        <th>Источник</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="estimate-body">
                    <tr class="empty"><td colspan="7">Ничего не добавлено</td></tr>
                </tbody>
            </table>

            <div class="totals">
                <div class="total-row"><span>Сумма:</span> <span id="subtotal">0</span> ₽</div>
                <div class="total-row"><span>НДС 20%:</span> <span id="vat">0</span> ₽</div>
                <div class="total-row grand"><span>Итого с НДС:</span> <span id="grand">0</span> ₽</div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="app.js?v=13"></script>
</body>
</html>
