<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчёт сметы ремонта</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Смета ремонта</h1>

        <section class="input-block">
            <label for="area">Площадь помещения (м²)</label>
            <input type="number" id="area" min="0" step="0.1" value="20">
        </section>

        <div class="columns">
            <section class="column">
                <h2>Работы</h2>
                <div id="works-list" class="checklist"></div>
            </section>

            <section class="column">
                <h2>Материалы</h2>
                <div id="materials-list" class="checklist"></div>
            </section>
        </div>

        <section class="result">
            <h2>Итог</h2>
            <div class="result-row"><span>Работы:</span> <span id="works-total">0</span> ₽</div>
            <div class="result-row"><span>Материалы:</span> <span id="materials-total">0</span> ₽</div>
            <div class="result-row total"><span>Всего:</span> <span id="grand-total">0</span> ₽</div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
