<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расчёт сметы ремонта</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Смета ремонта</h1>

        <section class="input-block">
            <label for="area">Площадь (м²)</label>
            <input type="number" id="area" min="0" step="0.1" value="1">
        </section>

        <div id="status" class="status"></div>

        <table id="estimate-table">
            <thead>
                <tr>
                    <th>Название</th>
                    <th>Ед. изм.</th>
                    <th>Кол-во</th>
                    <th>Цена за ед.</th>
                    <th>Итого</th>
                </tr>
            </thead>
            <tbody id="estimate-body"></tbody>
        </table>

        <section class="result">
            <div class="result-row total"><span>Общая сумма:</span> <span id="grand-total">0</span> ₽</div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
