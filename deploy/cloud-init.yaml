#cloud-config
# Timeweb Cloud cloud-init: prepares an Ubuntu 24.04 server to run the
# petrovich-proxy backend in Docker. It installs Docker + Compose and opens
# the backend port. No secrets are stored here — clone the repo and start the
# stack manually after first boot (see deploy/README.md).

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git
  - ufw

runcmd:
  # --- Docker Engine + Compose plugin (official repo) ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  # --- Firewall: SSH + backend port only ---
  - ufw allow OpenSSH
  - ufw allow 8000/tcp
  - ufw --force enable

write_files:
  - path: /etc/motd
    content: |
      petrovich-proxy host (Timeweb). Deploy:
        git clone <repo-url> /opt/estimate-app
        cd /opt/estimate-app && docker compose up -d --build
      Check: curl localhost:8000/health
